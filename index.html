<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SERENIA VR Lite</title>
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
</head>

<body><a-scene renderer="antialias:false"><a-sky color="#0B1320"></a-sky><a-entity
            light="type: ambient; intensity: 1; color: #FFFFFF"></a-entity><a-plane position="0 0 -5" rotation="-90 0 0"
            width="30" height="30" color="#2B2B2B"></a-plane><a-plane position="0 0.01 -6" rotation="-90 0 0" width="3"
            height="20" color="#5C4B3A"></a-plane><a-cylinder position="-4 2 -5" radius="0.4" height="4"
            color="#3A2518"></a-cylinder><a-sphere position="-4 4.5 -5" radius="1.3"
            color="#345642"></a-sphere><a-cylinder position="4 2 -7" radius="0.4" height="4"
            color="#3A2518"></a-cylinder><a-sphere position="4 4.5 -7" radius="1.3"
            color="#345642"></a-sphere><a-cylinder position="-5 2 -12" radius="0.4" height="4"
            color="#3A2518"></a-cylinder><a-sphere position="-5 4.5 -12" radius="1.3"
            color="#345642"></a-sphere><a-cylinder position="5 2 -14" radius="0.4" height="4"
            color="#3A2518"></a-cylinder><a-sphere position="5 4.5 -14" radius="1.3" color="#345642"></a-sphere><a-plane
            position="0 2 -3" width="4" height="1" color="#1F2937"></a-plane><a-text value="SERENIA VR" align="center"
            color="#FFFFFF" position="0 2 -2.95" width="5"></a-text><a-camera position="0 1.6 4"></a-camera></a-scene>
</body>

</html>
