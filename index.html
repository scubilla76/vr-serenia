<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>SERENIA VR - Bosque de Otoño</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.7.0/dist/aframe.min.js"></script>
</head>

<body>

  <a-scene
    renderer="antialias: true; colorManagement: true; physicallyCorrectLights: false"
    fog="type: exponential; color: #f6c79a; density: 0.035">

    <a-sky color="#F5B67A"></a-sky>

    <!-- Luz ambiental del atardecer -->
    <a-entity light="type: hemisphere; color: #ffe7b0; groundColor: #5b4030; intensity: 1.2"></a-entity>

    <!-- Sol cálido -->
    <a-entity
      position="0 8 -14"
      geometry="primitive: sphere; radius: 1.2"
      material="color: #ffbd6b; emissive: #ff9e4d; emissiveIntensity: 0.8">
    </a-entity>

    <a-entity
      light="type: directional; color: #ffbf80; intensity: 1.5"
      position="-2 5 -2">
    </a-entity>

    <a-entity
      light="type: point; color: #ff8e4c; intensity: 1.2; distance: 22"
      position="0 7 -12">
    </a-entity>

    <!-- ========================= -->
    <!-- SUELO -->
    <!-- ========================= -->

    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="30"
      height="30"
      color="#5D4331">
    </a-plane>


    <!-- ========================= -->
    <!-- CAMINO -->
    <!-- ========================= -->

    <a-plane
      position="0 0.02 -5"
      rotation="-90 0 0"
      width="4"
      height="25"
      color="#C9905F">
    </a-plane>


    <!-- ========================= -->
    <!-- ÁRBOLES -->
    <!-- ========================= -->

    <!-- Árbol 1 -->
    <a-cylinder
      position="-4 2 -4"
      radius="0.5"
      height="4"
      color="#5C3B24">
    </a-cylinder>

    <a-sphere
      position="-4 4.5 -4"
      radius="2"
      color="#C96B32">
    </a-sphere>


    <!-- Árbol 2 -->
    <a-cylinder
      position="4 2 -7"
      radius="0.5"
      height="4"
      color="#5C3B24">
    </a-cylinder>

    <a-sphere
      position="4 4.5 -7"
      radius="2"
      color="#D99036">
    </a-sphere>


    <!-- Árbol 3 -->
    <a-cylinder
      position="-5 2 -12"
      radius="0.5"
      height="4"
      color="#5C3B24">
    </a-cylinder>

    <a-sphere
      position="-5 4.5 -12"
      radius="2"
      color="#B94E2C">
    </a-sphere>


    <!-- Árbol 4 -->
    <a-cylinder
      position="5 2 -15"
      radius="0.5"
      height="4"
      color="#5C3B24">
    </a-cylinder>

    <a-sphere
      position="5 4.5 -15"
      radius="2"
      color="#E0A83B">
    </a-sphere>


    <!-- ========================= -->
    <!-- CÁMARA -->
    <!-- ========================= -->

    <a-camera
      position="0 1.6 4">
    </a-camera>
    <a-text value="BIENVENIDO A SERENIA VR"
    position="-3 2 -1"
    color="#2F1A8C"
    width="10">
  </a-text>

  </a-scene>

</body>
</html>
